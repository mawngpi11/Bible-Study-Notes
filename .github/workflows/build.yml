name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Project and Build
      run: |
        flutter create --org com.example temp_app
        rm -rf temp_app/lib/main.dart
        cp lib/main.dart temp_app/lib/main.dart
        cd temp_app
        flutter build apk --split-per-abi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bible-app-apk
        path: temp_app/build/app/outputs/flutter-apk/*.apk
